# Haftada 3 gün (Pzt/Çar/Cum) TR 05:00 civarı — UTC 02:00
name: Auto Article Generation

on:
  schedule:
    - cron: "0 2 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-article
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate article
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-article.mjs

      - name: Commit and push changes
        if: success()
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git config advice.addIgnoredFile false

          SLUG="${{ steps.generate.outputs.slug }}"
          if [ -z "$SLUG" ] && [ -f .auto-article-last-run.json ]; then
            SLUG="$(node -e "console.log(JSON.parse(require('fs').readFileSync('.auto-article-last-run.json','utf8')).slug || '')")"
          fi
          if [ -z "$SLUG" ]; then
            echo "Slug bulunamadı; commit atlanıyor."
            exit 1
          fi

          echo "Commit slug: ${SLUG}"

          for path in \
            "lib/generatedLegalArticleData.ts" \
            "generated-articles/${SLUG}.json" \
            "generated-articles/${SLUG}.md"
          do
            if [ -f "$path" ]; then
              git add "$path"
            else
              echo "Uyarı: dosya yok, atlanıyor: $path"
            fi
          done

          if git diff --cached --quiet; then
            echo "Değişiklik yok; commit atlanıyor."
            exit 0
          fi

          git commit -m "add article on ${SLUG}"
          git push
